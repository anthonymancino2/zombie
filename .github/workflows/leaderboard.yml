name: Snapshot leaderboard

# Live scores are retained MQTT messages on a free public broker. Retained messages do not
# survive a broker restart, so this drains them on a schedule and commits the result, giving
# the board a durable baseline that the game merges with whatever is live at page load.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save mqtt@5
      - run: node tools/snapshot-leaderboard.mjs
      - name: Commit if the board moved
        run: |
          if [ -z "$(git status --porcelain data/leaderboard.json)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          git commit -m "Snapshot global leaderboard"
          git push
